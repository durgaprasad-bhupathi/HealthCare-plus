<div class="contact-wrapper">
  <div class="contact-form">
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="row">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input id="name" type="text" formControlName="name" placeholder="Enter your full name" />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input id="email" type="email" formControlName="email" placeholder="Enter your email" />
        </div>
      </div>

      <div class="form-group">
        <label for="subject">Subject</label>
        <input id="subject" type="text" formControlName="subject" placeholder="Enter subject" />
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea
          id="message"
          formControlName="message"
          rows="6"
          placeholder="Write your message"
        ></textarea>
      </div>

      <button type="submit">Send Message</button>

      <p *ngIf="success" class="success-msg">Message sent successfully!</p>
    </form>
  </div>
</div>
